# Mihomo policy-group template for config/rules.yaml.
# Merge this list into your configuration after defining proxies or proxy-providers.
# No node, subscription URL, credential, or private endpoint belongs in this file.
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    exclude-type: direct
    proxies:
      - "⚡ 自动选择"

  - name: "⚡ 自动选择"
    type: url-test
    include-all: true
    exclude-type: direct
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    tolerance: 50
    lazy: true
    expected-status: 204
    empty-fallback: REJECT

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)(🇺🇸|美国|美國|美西|美东|美東|United States|Los Angeles|San Jose|Seattle|New York|(^|[^A-Za-z])US([^A-Za-z]|$))"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    tolerance: 80
    lazy: true
    expected-status: 204
    empty-fallback: REJECT

  - name: "🧭 Final"
    type: select
    proxies:
      - "🚀 节点选择"
      - "⚡ 自动选择"
      - DIRECT

  # InternationalGaming is deliberately fail-closed: no DIRECT option.
  - name: "🎮 国际游戏"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🇺🇸 美国节点"
      - "⚡ 自动选择"

  - name: "🤖 AI 服务"
